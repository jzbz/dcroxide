name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly long-run fuzzing (see the nightly-fuzz job).
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Differential tests must run in CI — a missing oracle is a failure, not a skip.
  DCROXIDE_REQUIRE_ORACLE: "1"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain action: rust-toolchain.toml names the version and its
      # components, and duplicating it here is how the two drift apart.
      # Installing before the cache step keeps the cache key on the right rustc.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  lint-latest:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    # A new stable every six weeks means new lints, and `-D warnings` would
    # turn them into red builds on pull requests that did not cause them.
    # This job surfaces them the week they land without blocking anyone.
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is there for consensus consistency, not
        # coverage bookkeeping: QK-0006 records dcrd's own amd64
        # assembly disagreeing with its portable Go by one ulp in
        # ban-decay math, so platform-dependence has already bitten in
        # exactly this problem domain, and arm64 behavior should be
        # tested rather than assumed.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml (see the lint job).
      - run: rustup toolchain install
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: MSRV build (1.94)
    runs-on: ubuntu-latest
    env:
      # Must beat rust-toolchain.toml, which outranks `rustup default` and
      # would otherwise have this job re-check the pinned toolchain — passing
      # while testing nothing about the floor it exists to defend.
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    # missing_docs is already denied at build time, but broken intra-doc
    # links and malformed doc markup only surface under rustdoc — without
    # this job they land silently and the enforced-docs investment rots.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  typos:
    name: typos
    runs-on: ubuntu-latest
    # The prose is part of the product here: PARITY.md and QUIRKS.md are
    # spec artifacts. _typos.toml carries the deliberate exceptions —
    # dcrd's own typos are reproduced, not corrected.
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.49.0

  no-std:
    name: no_std check (x86_64-unknown-none)
    runs-on: ubuntu-latest
    # The crates below advertise no_std via cfg_attr, but every other
    # job builds with the std feature on, so nothing else ever compiles
    # the claim. This job checks them on a no-OS target so a dependency
    # or cfg mistake that drags std into a consensus core fails CI.
    #
    # For dcrec this proves the *Rust* side is std-free. secp256k1-sys
    # still compiles the C library with the host compiler for this
    # triple, and `cargo check` never links, so a genuinely freestanding
    # build would additionally need a cross C toolchain and a global
    # allocator. The check is still worth having: it is what catches a
    # `use std::` or a default-features dependency creeping back in.
    #
    # Not yet listed: blockchain, fees, gcs, mempool, mining, stake, and
    # txscript. Every one of them fails on the same five crates
    # (secp256k1-sys, once_cell, getrandom, crypto-common, der) pulled in
    # through dcroxide-dcrec's default features, so each needs
    # `default-features = false` on its dcroxide-* path dependencies plus
    # a `std` feature that re-enables them. dcroxide-database is NOT the
    # blocker it looks like — making it optional in stake was tried and
    # changed nothing.
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Check the no_std crates on a no-OS target
        run: |
          for c in base58 chaincfg chainhash crypto dcrec standalone uint256 wire; do
            cargo check -p "dcroxide-$c" --no-default-features --target x86_64-unknown-none
          done

  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz needs nightly, and rust-toolchain.toml at the repo root
      # applies inside fuzz/ as well — without this the pin would win and
      # the build would fail on nightly-only flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target briefly
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=60
          done

  nightly-fuzz:
    name: nightly fuzz (10m per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # See fuzz-smoke: the root pin reaches into fuzz/ and must be overridden.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target for 10 minutes
        run: |
          for t in $(cargo fuzz list); do
            cargo fuzz run "$t" -- -max_total_time=600
          done
