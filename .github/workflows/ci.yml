name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly long-run fuzzing (see the nightly-fuzz job).
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Differential tests must run in CI — a missing oracle is a failure, not a skip.
  DCROXIDE_REQUIRE_ORACLE: "1"
  # Same rule for fault injection: the ENOSPC test mounts a size-limited
  # tmpfs in a user namespace to prove a real storage failure reaches the
  # fatal latch, the powerloss shim test builds tools/powerloss with cc and
  # replays its undo log with python3, the exists-address power-cut test
  # runs the daemon under that shim and kills it, and a fault-injection
  # test that skips quietly is worse than none — the suite goes green
  # having checked nothing. All three tests are Linux-only
  # (`cfg(target_os = "linux")`), so this has no effect on the macOS and
  # Windows matrix entries.
  DCROXIDE_REQUIRE_FAULT_INJECTION: "1"
  # The reference Go: the release dcrd's contrib/docker/Dockerfile builds
  # the parity pin with, to the patch (ADR-0001's 2026-10-26 addendum on
  # the reference Go).
  # Every setup-go step below takes it from here, so the oracle, the tool
  # modules and the interop daemon are built with one toolchain, and a pin
  # bump that moves the Dockerfile's release moves this line.
  GO_VERSION: "1.26.2"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain action: rust-toolchain.toml names the version and its
      # components, and duplicating it here is how the two drift apart.
      # Installing before the cache step keeps the cache key on the right rustc.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # fuzz/ is a workspace of its own, and the fuzz jobs' `cargo fuzz
      # run` adds a package its lock lacks without failing. Resolving it
      # here with `--locked` fails instead; dcroxide-testutil's
      # the_fuzz_lock_matches_the_workspace_lock holds the packages the
      # lock has to the workspace lock's versions.
      - run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

  lint-latest:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    # A new stable every six weeks means new lints, and `-D warnings` would
    # turn them into red builds on pull requests that did not cause them.
    # This job surfaces them the week they land without blocking anyone.
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is there for consensus consistency, not
        # coverage bookkeeping: QK-0006 records dcrd's own amd64
        # assembly disagreeing with its portable Go by one ulp in
        # ban-decay math, so platform-dependence has already bitten in
        # exactly this problem domain, and arm64 behavior should be
        # tested rather than assumed.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Toolchain comes from rust-toolchain.toml (see the lint job).
      - run: rustup toolchain install
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # dcroxide-dcrec's vectors again without its default `std`. The run
      # above only builds the crate with `std` on, and without it
      # libsecp256k1 builds a context on the stack for every call where
      # `std` keeps one per thread, so both configurations need running.
      - run: cargo test -p dcroxide-dcrec --no-default-features

  test-wrapping:
    name: test (overflow checks off, as release ships)
    runs-on: ubuntu-latest
    # Every other test run keeps the dev profile's overflow checks, so an
    # overflowing path panics there and no test sees what the shipped
    # binary computes: [profile.release] wraps (`overflow-checks = false`,
    # pinned in Cargo.toml). This runs the suites again with the checks
    # off and debug assertions still on, so the differential and vector
    # suites pass against the arithmetic that actually ships.
    env:
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "false"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The script engine and the block script check once more with debug
      # assertions off as well, which no other run does. Under them the
      # engine refuses a transaction hash that is not its transaction's
      # and the block script check re-hashes its block, so a test that
      # hands over a wrong hash can show only the refusal there. What the
      # shipped build does with one (its `SigHashAll` signatures stop
      # verifying, and nothing panics) is in the arms of those tests that
      # run only here.
      - run: cargo test -p dcroxide-txscript -p dcroxide-blockchain --features dcroxide-blockchain/std
        env:
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "false"

  tls-soft-backends:
    name: TLS provider (software backends, no ring)
    runs-on: ubuntu-latest
    # dcroxide-tlscrypto's record protection runs on aes, polyval, chacha20
    # and poly1305, and its transcript hash, HMAC, HKDF and PRF on sha2,
    # each of which picks a hardware backend at run time (AES-NI or the
    # ARMv8 AES instructions, CLMUL or PMULL, SSE2 or AVX2, SHA-NI, AVX2 or
    # the ARMv8 SHA-2 and SHA-3 instructions) and falls back to portable
    # code without one. The runners have the hardware, so every other job
    # tests only those backends, and a processor without it would be the
    # first to run the portable ones. This job forces the portable ones
    # with each crate's own cfg (aes 0.9's `aes_backend`, polyval 0.7's
    # `polyval_backend`, chacha20 0.10's `chacha20_backend`, poly1305
    # 0.9's `poly1305_backend`, sha2 0.11's `sha2_backend`, and
    # curve25519-dalek 5's `curve25519_dalek_backend` for the signatures
    # the crate takes on later, where Ed25519 verification's double-base
    # multiplication is what it switches; X25519's ladder and base-point
    # table are the same portable code on every backend) and runs the
    # crate's tests, Wycheproof's vectors among them, on them (ADR-0015
    # T10).
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # The workflow-wide DCROXIDE_REQUIRE_ORACLE turns a missing oracle
      # into a failure, and the crate's key exchange verdicts are checked
      # against Go's through the oracle, under it on the reference Go
      # alone, so the reference Go is installed as in the test job.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dcroxide-tlscrypto
        env:
          RUSTFLAGS: >-
            --cfg aes_backend="soft"
            --cfg polyval_backend="soft"
            --cfg chacha20_backend="soft"
            --cfg poly1305_backend="soft"
            --cfg sha2_backend="soft"
            --cfg curve25519_dalek_backend="serial"
      # The library on its own, which builds no dev-dependency. Under the
      # workspace's resolver 3, with only this package selected, rustls's
      # `ring` feature is off, since only the crate's ring parity tests ask
      # for it, so a `rustls::crypto::ring` outside the tests fails here
      # rather than first at the switch that removes ring (ADR-0015).
      - name: Build the library without ring
        run: |
          set -o pipefail
          cargo check -p dcroxide-tlscrypto --lib
          # `grep -c` exits 1 when it counts nothing, which is the pass
          # here, so its status is dropped and the count is what is
          # checked; a failing `cargo tree` still fails the step.
          ring=$(cargo tree -p dcroxide-tlscrypto -e normal --prefix none -f '{p}' | { grep -c '^ring ' || true; })
          if [ "$ring" -ne 0 ]; then
            echo "the dcroxide-tlscrypto library reaches ring" >&2
            exit 1
          fi

  dcrd-interop:
    name: dcrd interop (live socket)
    runs-on: ubuntu-latest
    # The Go oracle links dcrd's packages in-process, which cannot test the
    # seam where two programs talk: negotiation over TCP, framing across real
    # reads, and who sends what when. This runs the actual daemon.
    #
    # One Linux leg deliberately. The value is in the seam, not in repeating
    # it per OS, and a per-OS matrix would triple the dcrd build for coverage
    # the unit suites already give on those platforms.
    env:
      # The same commit as DCRD_PARITY_COMMIT in dcroxide-testutil, which
      # refuses any other stamped revision; its unit tests fail when the
      # two drift apart.
      DCRD_COMMIT: 3360ae4dbef8ccfd5880016cadd03a41af0aad9f
      # A missing binary must fail this job rather than skip its tests.
      DCROXIDE_REQUIRE_DCRD: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # dcrd is built with GO_VERSION, the reference Go, rather than an
      # older Go its `go 1.25.0` line also admits: its debug.go sets
      # `//go:debug default=go1.26` behind `//go:build go1.26`, so a 1.25
      # build has neither those settings nor Go 1.26's two added hybrid TLS
      # key exchanges. The build flags stay `go build`'s defaults, not the
      # release image's (ADR-0001's 2026-10-26 addendum on the reference
      # Go).
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache the dcrd binary
        id: dcrd-cache
        uses: actions/cache@v6
        with:
          path: ~/dcrd-bin
          # The Go release is part of the key: a binary built with another
          # one is a different daemon.
          key: dcrd-${{ env.DCRD_COMMIT }}-go${{ env.GO_VERSION }}-${{ runner.os }}
      # Built from a clone at the pinned commit, never a release download: a
      # release is a different specification. The clone (rather than a
      # worktree) is what lets Go stamp the VCS revision into --version,
      # which dcroxide-testutil checks before it will run against the binary.
      - name: Build dcrd at the parity commit
        if: steps.dcrd-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/decred/dcrd.git /tmp/dcrd-src
          git -C /tmp/dcrd-src checkout --detach "$DCRD_COMMIT"
          mkdir -p ~/dcrd-bin
          (cd /tmp/dcrd-src && go build -buildvcs=true -o ~/dcrd-bin/dcrd .)
          ~/dcrd-bin/dcrd --version
      - uses: Swatinem/rust-cache@v2
      - name: Interop tests against a live dcrd
        run: |
          export DCROXIDE_DCRD_BIN="$HOME/dcrd-bin/dcrd"
          cargo test -p dcroxide-node --test dcrd_interop -- --test-threads=1

  go-tools:
    name: go vet + go test (tools/)
    runs-on: ubuntu-latest
    # Five tools under tools/ are separate Go modules, and no cargo command
    # vets or tests one: the Rust suites only build the oracle. So
    # tools/pinbump's main_test.go, which pins the bump review list
    # keeping upstream `_test.go` changes and both sides of a move, ran
    # only when someone ran it by hand, and a stale tool surfaced only
    # at the next manual regeneration. fullblockgen is left out until its
    # go.mod's `go 1.27.0`, newer than GO_VERSION, comes down (ADR-0001's
    # 2026-10-26 addendum on the reference Go).
    # chainopsgen, disapprovalgen, mempoolvectors, mixpoolgen,
    # profilergen and utxoviewgen are not modules but overlays that
    # compile only inside a dcrd checkout's packages, so they are left
    # out too.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - name: Vet and test the tool modules
        run: |
          for m in pinbump helpgen oracle dcrdstat; do
            (cd "tools/$m" && go vet ./... && go test ./...)
          done

  deny:
    name: cargo-deny (licenses, advisories, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    # missing_docs is already denied at build time, but broken intra-doc
    # links and malformed doc markup only surface under rustdoc — without
    # this job they land silently and the enforced-docs investment rots.
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  typos:
    name: typos
    runs-on: ubuntu-latest
    # The prose is part of the product here: PARITY.md and QUIRKS.md are
    # spec artifacts. _typos.toml carries the deliberate exceptions —
    # dcrd's own typos are reproduced, not corrected.
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.3

  no-std:
    name: no_std check (x86_64-unknown-none)
    runs-on: ubuntu-latest
    # The crates below advertise no_std via cfg_attr, but every other
    # job builds with the std feature on, so nothing else ever compiles
    # the claim. This job checks them on a no-OS target so a dependency
    # or cfg mistake that drags std into a consensus core fails CI.
    #
    # For dcrec this proves the *Rust* side is std-free. secp256k1-sys
    # still compiles the C library with the host compiler for this
    # triple, and `cargo check` never links, so a genuinely freestanding
    # build would additionally need a cross C toolchain and a global
    # allocator. The check is still worth having: it is what catches a
    # `use std::` or a default-features dependency creeping back in.
    #
    # Not yet listed: blockchain, fees, gcs, mempool, mining, stake, and
    # txscript. All seven reach secp256k1-sys with its `std` feature on
    # through dcroxide-dcrec's default features, and secp256k1-sys does
    # not build for this target that way: txscript fails on it and on
    # nothing else. So each needs `default-features = false` on its
    # dcroxide-* path dependencies plus a `std` feature that re-enables
    # them. That is not the whole job for the six that also reach
    # dcroxide-database (all but txscript): it builds redb with redb's
    # default `std` feature, and stake fails on redb as well as on
    # secp256k1-sys. Turning redb's default features off is not enough on
    # its own: 4.3.0 builds without `std` only when `std` is off and its
    # `experimental-api-5` preview is on (`build.rs:5-13`).
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: Check the no_std crates on a no-OS target
        run: |
          for c in base58 chaincfg chainhash crypto dcrec standalone uint256 wire; do
            cargo check -p "dcroxide-$c" --no-default-features --target x86_64-unknown-none
          done

  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz needs nightly, and rust-toolchain.toml at the repo root
      # applies inside fuzz/ as well — without this the pin would win and
      # the build would fail on nightly-only flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target briefly
        run: |
          # The list is taken by a plain assignment so a failing `cargo
          # fuzz list` fails the step. Inside the for-loop word list its
          # exit status is lost, the loop runs zero times, and the job
          # goes green having fuzzed nothing. The count check catches a
          # list that succeeds but comes back short of fuzz/Cargo.toml.
          targets=$(cargo fuzz list)
          declared=$(grep -c '^\[\[bin\]\]' fuzz/Cargo.toml)
          listed=$(wc -w <<<"$targets")
          if [ "$listed" -eq 0 ] || [ "$listed" -ne "$declared" ]; then
            echo "cargo fuzz list gave $listed targets; fuzz/Cargo.toml declares $declared" >&2
            exit 1
          fi
          for t in $targets; do
            cargo fuzz run "$t" -- -max_total_time=60
          done
      # Without this a crash is only ever a red X: the input that caused
      # it lives in fuzz/artifacts on a runner that is about to be
      # destroyed, so nobody can reproduce or minimize it.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-smoke
          path: fuzz/artifacts/
          if-no-files-found: ignore

  nightly-fuzz:
    name: nightly fuzz (10m per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # See fuzz-smoke: the root pin reaches into fuzz/ and must be overridden.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target for 10 minutes
        run: |
          # See the smoke job: an empty or short list must fail the step.
          targets=$(cargo fuzz list)
          declared=$(grep -c '^\[\[bin\]\]' fuzz/Cargo.toml)
          listed=$(wc -w <<<"$targets")
          if [ "$listed" -eq 0 ] || [ "$listed" -ne "$declared" ]; then
            echo "cargo fuzz list gave $listed targets; fuzz/Cargo.toml declares $declared" >&2
            exit 1
          fi
          for t in $targets; do
            cargo fuzz run "$t" -- -max_total_time=600
          done
      # See the smoke job: a nightly crash is the one most likely to be
      # noticed hours later, so the reproducer has to outlive the runner.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-nightly
          path: fuzz/artifacts/
          if-no-files-found: ignore
