name: Constant time

# dcroxide-tlscrypto's timing check (ADR-0015 T10): dudect's fixed-against-
# random t-test, in tree in crates/dcroxide-tlscrypto/src/ct_check.rs, on
# ECDSA and Ed25519 signing, the four key exchanges, the three AEADs,
# AES-GCM's keying and HMAC, with a positive control that must be found. A
# workflow of its own, apart from ci.yml: it times code, so its jobs run
# nothing else, and a change to the provider runs it without waiting on the
# rest of CI.
#
# The paths are what changes the timed binary or the harness: the crate,
# the lock (a dependency's version), the pinned compiler and the root
# manifest's release profile (codegen, which can turn a constant-time
# select into a branch), dcroxide-testutil (the generator that draws the
# classes), dcroxide-crypto (a normal dependency of the crate, linked into
# the timed binary, whose features on chacha20 merge with the AEAD's), the
# DIT probe the arm64 jobs run (.github/dit-probe.rs), the library that
# switches DIT on for a dispatch that asks for it (.github/dit-on.rs), and
# this file.
#
# dcroxide-dcrec's timing check (ADR-0017's second addendum of
# 2026-11-19), in tree in crates/dcroxide-dcrec/src/ct_check.rs on the
# shared harness in crates/dcroxide-testutil/src/ct.rs, on every entry
# point of dcrec that computes on a secret: the generator's
# multiplication by a secret
# scalar, the public key from a private key, ECDSA and EC-Schnorr-DCRv0
# signing by the key and by the nonce, the RFC 6979 nonce, the key's
# range check, HD derivation's private child by Il and by the parent, and
# Ed25519's public key and signing, with a positive control (k256's
# variable-time multiply) that must be found. It is the second job, apart
# from the first, since dcrec times twice, with the precomputed basepoint
# table and without it, and has no backends to force. Its paths are the
# crate, dcroxide-secp256k1-vartime (the curve check every public key
# from a private key passes, inside the timed region) and, with the
# first job's, dcroxide-crypto (BLAKE-256, in Schnorr signing),
# dcroxide-testutil (the harness), the lock, the compiler, the release
# profile and this file. Either job's paths run both jobs.
#
# A dispatch can narrow the run, to time one target for longer on the
# legs where it failed. Its inputs: the suite, both jobs by default, or
# one of them; a target, by its test name in that suite's ct_check (empty
# runs every target, as pushes and nightlies do, and a target needs one
# suite picked); the seconds each target runs for (60 when empty); the
# legs, all four by default, where a leg left out takes no runner; and
# DIT, off by default, which on the arm64 legs runs the timed targets
# with PSTATE.DIT set and on the x86_64 legs changes nothing. dcrec's job
# takes only the architecture from the legs, having no -soft build: an
# x86_64 leg picks x86_64, an arm64 leg arm64, and all both. Pushes, pull
# requests and nightlies give no inputs and run as they always have. The
# inputs reach the shell through the environment alone and are checked
# before anything else runs.
on:
  push:
    branches: [master]
    paths:
      - "crates/dcroxide-tlscrypto/**"
      - "crates/dcroxide-testutil/**"
      - "crates/dcroxide-crypto/**"
      - "crates/dcroxide-dcrec/**"
      - "crates/dcroxide-secp256k1-vartime/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/dit-probe.rs"
      - ".github/dit-on.rs"
      - ".github/workflows/constant-time.yml"
  pull_request:
    paths:
      - "crates/dcroxide-tlscrypto/**"
      - "crates/dcroxide-testutil/**"
      - "crates/dcroxide-crypto/**"
      - "crates/dcroxide-dcrec/**"
      - "crates/dcroxide-secp256k1-vartime/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/dit-probe.rs"
      - ".github/dit-on.rs"
      - ".github/workflows/constant-time.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "The suite: both, or dcroxide-tlscrypto's or dcroxide-dcrec's alone; a target needs one"
        type: choice
        default: both
        options:
          - both
          - tlscrypto
          - dcrec
      target:
        description: "One target by its test name in the suite picked, such as ecdh_p384_complete or public_key, run alone (the positive control runs only if it is the one named); empty runs every target"
        type: string
        default: ""
      seconds:
        description: "Each target's budget in whole seconds: up to 1800 for one target, up to 90 for every target"
        type: string
        default: "60"
      legs:
        description: "The legs to run"
        type: choice
        default: all
        options:
          - all
          - arm64
          - arm64-soft
          - arm64 and arm64-soft
          - x86_64
          - x86_64-soft
          - x86_64 and x86_64-soft
      dit:
        description: "Arm's DIT for the timed targets on the arm64 legs; the x86_64 legs run as they would without it"
        type: choice
        default: "off"
        options:
          - "off"
          - "on"

env:
  CARGO_TERM_COLOR: always

jobs:
  constant-time:
    name: constant time (${{ matrix.leg }})
    # dcroxide-tlscrypto's targets, unless a dispatch picks dcrec's alone.
    if: inputs.suite != 'dcrec'
    # 27 targets, each running for its budget: at 10 s, about 5 minutes
    # after the build; at 60 s, nightly and on dispatch, about 27. A
    # dispatch's seconds are capped so that the same hour covers the run:
    # 90 for every target, about 41 minutes, and 1800 for one.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every leg, unless a dispatch picks some. Only the legs listed
        # here get a job, so a leg a dispatch leaves out takes no runner.
        leg: >-
          ${{ fromJSON(
          inputs.legs == 'arm64' && '["arm64"]'
          || inputs.legs == 'arm64-soft' && '["arm64-soft"]'
          || inputs.legs == 'arm64 and arm64-soft' && '["arm64","arm64-soft"]'
          || inputs.legs == 'x86_64' && '["x86_64"]'
          || inputs.legs == 'x86_64-soft' && '["x86_64-soft"]'
          || inputs.legs == 'x86_64 and x86_64-soft' && '["x86_64","x86_64-soft"]'
          || '["x86_64","x86_64-soft","arm64","arm64-soft"]') }}
    # The runner and the backends follow from the leg's name, since a
    # matrix's include would bring back, as a job of its own, a leg the
    # list leaves out.
    runs-on: ${{ startsWith(matrix.leg, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      # x86_64 and arm64 take the backends each crate picks for the
      # processor. On x86_64, at run time: AES-NI, CLMUL, SSE2 or AVX2 for
      # ChaCha20, AVX2 for Poly1305, and SHA-NI for SHA-256 and AVX2 for
      # SHA-512. On arm64: the ARMv8 AES and PMULL instructions and the
      # SHA-2 and SHA-3 extensions at run time, and NEON for ChaCha20,
      # which chacha20 fixes at compile time. poly1305 has only its
      # portable code on arm64, so there both legs run the same Poly1305.
      #
      # The -soft legs take the portable ones, forced with each crate's own
      # cfg as ci.yml's tls-soft-backends job forces them: aes's fixslice,
      # polyval's software multiply, chacha20's and poly1305's portable
      # code, whose constant-time claims are what this checks, and sha2's
      # portable compression. dalek's cfg is kept from that job, though it
      # switches only verification's double-base multiplication, which no
      # target times.
      RUSTFLAGS: >-
        ${{ endsWith(matrix.leg, '-soft') && '--cfg aes_backend="soft"
        --cfg polyval_backend="soft"
        --cfg chacha20_backend="soft"
        --cfg poly1305_backend="soft"
        --cfg sha2_backend="soft"
        --cfg curve25519_dalek_backend="serial"' || '' }}
      # Each target's budget in seconds: a screen on pushes and pull
      # requests, and six times as long nightly and on dispatch, which
      # makes up for each fixed class's share of the samples, about
      # 1/(2K) of them with K fixed classes. A dispatch can set its own.
      DCROXIDE_CT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && (inputs.seconds || '60') || github.event_name == 'schedule' && '60' || '10' }}
      # The one target a dispatch picks, or empty for every target.
      CT_TARGET: ${{ inputs.target }}
      # The suite a dispatch picks, which with a target must be one.
      CT_SUITE: ${{ inputs.suite }}
      # "on" on an arm64 leg of a dispatch that asks for DIT, and "off"
      # everywhere else, whatever the input holds.
      CT_DIT: ${{ startsWith(matrix.leg, 'arm64') && inputs.dit == 'on' && 'on' || 'off' }}
    steps:
      # A dispatch's inputs, before anything is built: the target a test
      # name and nothing else, and the seconds a whole number within the
      # cap. The patterns are matched in the C locale, where [a-z] is the
      # 26 letters alone. The legs and DIT are choices, which need no
      # pattern: only the values the matrix and CT_DIT compare with
      # (without regard to case) change anything, and any other runs as
      # the default does. The messages do not repeat what was given, and
      # inputs that fail the check leave the run without a summary.
      - name: Check the dispatch's inputs
        id: inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          export LC_ALL=C
          if [ -n "$CT_TARGET" ] && ! [[ $CT_TARGET =~ ^[a-z][a-z0-9_]{0,63}$ ]]; then
            echo "::error::target is not a test name such as ecdh_p384_complete"
            exit 1
          fi
          if [ -n "$CT_TARGET" ] && [ "$CT_SUITE" = both ]; then
            echo "::error::a target needs the suite it belongs to, tlscrypto or dcrec"
            exit 1
          fi
          if [ -n "$CT_TARGET" ]; then cap=1800; else cap=90; fi
          if ! [[ $DCROXIDE_CT_SECONDS =~ ^[1-9][0-9]{0,4}$ ]] || [ "$DCROXIDE_CT_SECONDS" -gt "$cap" ]; then
            echo "::error::seconds is not a whole number from 1 to $cap"
            exit 1
          fi
      - uses: actions/checkout@v7
      # Toolchain comes from rust-toolchain.toml (see ci.yml's lint job).
      - run: rustup toolchain install
      # One cache per leg: the soft legs' RUSTFLAGS rebuild every crate.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.leg }}
      # Built first, so that the timed step compiles nothing.
      - name: Build the check
        run: cargo test -p dcroxide-tlscrypto --release --lib --locked --no-run
      # With DIT asked for on an arm64 leg, .github/dit-on.rs, compiled with
      # plain rustc as a shared library, outside the workspace for the
      # probe's reason below. Loaded into the test binary before its main,
      # it sets PSTATE.DIT in the main thread there, which the threads
      # the test harness starts inherit; exec clears it, so it cannot be
      # set by a program that starts the binary. Any other job skips this.
      - name: Build the DIT switch
        if: env.CT_DIT == 'on'
        run: rustc --edition 2024 --crate-type cdylib -o "$RUNNER_TEMP/libdit-on.so" .github/dit-on.rs
      # The machine the job landed on, so that one run's timings can be
      # read against another's: lscpu, the kernel, and the processor as
      # /proc/cpuinfo names it, each distinct line once with its count of
      # CPUs (on arm64 the implementer, part, variant and revision, on
      # x86_64 the vendor, model, stepping and microcode). On arm64 also
      # the first CPU's features and whether they hold DIT, the mode in
      # which Arm promises that the timing of its listed instructions does
      # not depend on their data. A processor that has DIT can hide it from
      # a guest, so the arm64 jobs then compile
      # .github/dit-probe.rs with plain rustc, outside the workspace, whose
      # ban on unsafe code it cannot meet, and run it: it sets PSTATE.DIT,
      # reads it back and clears it, in a process of its own that ends
      # there, and a processor without DIT ends it with SIGILL (status
      # 132). Linux leaves DIT off for user space, and the timed targets
      # run with it off unless a dispatch asks for it. The step only
      # describes, so it never fails the job.
      - name: Describe the processor
        continue-on-error: true
        run: |
          lscpu
          uname -r
          grep -E '^(CPU (implementer|architecture|variant|part|revision)|vendor_id|cpu family|model|model name|stepping|microcode)[[:space:]]*:' /proc/cpuinfo | sort | uniq -c
          if [ "$(uname -m)" = aarch64 ]; then
            grep -m 1 '^Features' /proc/cpuinfo
            if grep -m 1 '^Features' /proc/cpuinfo | grep -qw dit; then
              echo "DIT: supported"
            else
              echo "DIT: not supported"
            fi
            if rustc --edition 2024 -o "$RUNNER_TEMP/dit-probe" .github/dit-probe.rs; then
              "$RUNNER_TEMP/dit-probe" || echo "DIT probe: exited with status $?"
            else
              echo "DIT probe: did not compile"
            fi
          fi
      # One target at a time, in release mode, the way the module's doc
      # gives it. A target fails when a fixed class's |t| is above 10 and
      # its mean time differs from the random class's by 1 ns an operation
      # or more (the floor), or on too few samples to compare; the positive
      # control fails unless its leak fails by the same rule. On both
      # x86_64 legs, and only there, one failure can be a known report,
      # which passes: P-256 signing by the nonce with every failing
      # comparison quicker than the random class by 40 ns an operation or
      # less, the pattern measured on AMD EPYC 7763 runners (ct_check's
      # module doc). Every target runs after one fails. Each prints its row
      # and, when it passes, each class's result below it, the lines a
      # failure's message gives.
      # Those lines end with the target's trace, which a failure's message
      # carries too: a line marked "ct_check run |" with the fixed crop's
      # name, the segments' length and the addresses of the harness's code
      # and of the first chunk of inputs; one marked "ct_check random |"
      # with the random class's mean nanoseconds an operation uncropped, in
      # crop 32 (about nine tenths of the samples) and in each of six equal
      # segments of the counted time (about 10 s each at 60 s); and for
      # each fixed class one marked "ct_check class |" with its t and
      # difference uncropped and in crop 32, whatever their |t|, and its t
      # in each segment, "-" where a test had too few samples. The summary
      # takes none of them.
      #
      # With DIT on, cargo starts the test binary, and only it, with the
      # switch in LD_PRELOAD, through the runner it takes for the target.
      # The switch prints its readings in lines marked "ct_check dit |":
      # PSTATE.DIT at load, once set, in a thread it starts, and at exit.
      # It stops the binary if one after the switch reads 0, and the step
      # fails if the log lacks the readings, as when the library did not
      # load, so that a run that asked for DIT never passes with DIT seen
      # off in the main thread or in a new thread; the test harness's own
      # threads are not read. When the switch stops the lookup of a picked
      # target, or a target fails, the step ends before that check, failed
      # all the same, without its message.
      #
      # When a dispatch picks a target, that target alone runs, matched by
      # its whole name, and the positive control does not run unless it is
      # the one picked. A filter that matches nothing runs no test and
      # passes, so the picked name is first looked up in the list of
      # targets, and the job fails if no target has it.
      - name: Time the targets
        run: |
          set -o pipefail
          if [ "$CT_DIT" = on ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="env LD_PRELOAD=$RUNNER_TEMP/libdit-on.so"
          fi
          if [ -n "$CT_TARGET" ]; then
            filter="ct_check::$CT_TARGET"
            exact=(--exact)
            listed=$(cargo test -p dcroxide-tlscrypto --release --lib --locked "$filter" -- \
              --ignored --list --exact)
            if ! grep -qFx "$filter: test" <<< "$listed"; then
              echo "::error::no ct_check target is named $CT_TARGET"
              exit 1
            fi
          else
            filter=ct_check
            exact=()
          fi
          cargo test -p dcroxide-tlscrypto --release --lib --locked "$filter" -- \
            --ignored --test-threads=1 --nocapture "${exact[@]}" 2>&1 | tee "$RUNNER_TEMP/ct-check.log"
          if [ "$CT_DIT" = on ] && ! { grep -q 'ct_check dit | PSTATE.DIT read [01] at load, 1 once set, 1 in a new thread' "$RUNNER_TEMP/ct-check.log" \
              && grep -q 'ct_check dit | PSTATE.DIT read 1 at exit' "$RUNNER_TEMP/ct-check.log"; }; then
            echo "::error::DIT was asked for, and the log does not show it on"
            exit 1
          fi
      # Each target's row: the fixed class that decides it (of the
      # classes that fail, the one whose result has the largest |t|, or
      # else the largest |t| of all) and that class's result, which for a
      # class that fails is its comparison of the largest difference among
      # those above 10, and otherwise its largest |t|: that comparison's t
      # and effect size (the difference of the means in standard
      # deviations, which unlike t does not grow with the samples), the
      # random class's nanoseconds an operation and the fixed class's
      # difference from them; the fixed class and the test (every sample,
      # or a crop by the share of samples it keeps), the samples on each
      # side, the samples counted, the operations in each sample, and the
      # verdict: "reported" for |t| above 4.5,
      # "reported (under the 1 ns floor)" for |t| above 10 on a smaller
      # difference, "known report (quicker by 40 ns or less)" for the known
      # report above, and "control found" for the positive control's. The
      # row is taken from wherever it falls on its line, which the test
      # runner's own output may have begun. The heading names the leg, the
      # budget, when a dispatch picked one, the target, and DIT when it
      # was asked for: "DIT on" when the log shows the switch's readings,
      # and "DIT asked for, not shown on" when it does not. The step runs
      # whatever became of the others, but not after the inputs' check
      # failed (it is skipped, not failed, on every other event), so that
      # the heading never holds a target that check refused.
      - name: Summarize the run
        if: always() && steps.inputs.outcome != 'failure'
        run: |
          dit=
          if [ "$CT_DIT" = on ]; then
            if grep -q 'ct_check dit | PSTATE.DIT read [01] at load, 1 once set, 1 in a new thread' "$RUNNER_TEMP/ct-check.log" 2> /dev/null \
              && grep -q 'ct_check dit | PSTATE.DIT read 1 at exit' "$RUNNER_TEMP/ct-check.log"; then
              dit=", DIT on"
            else
              dit=", DIT asked for, not shown on"
            fi
          fi
          {
            if [ -n "$CT_TARGET" ]; then
              echo "### ${{ matrix.leg }}, ${CT_TARGET} alone, ${DCROXIDE_CT_SECONDS} s${dit}"
            else
              echo "### ${{ matrix.leg }}, ${DCROXIDE_CT_SECONDS} s a target${dit}"
            fi
            echo
            echo "| target | t | effect | ns/op | difference | class | test | fixed | random | samples | batch | verdict |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            if [ -f "$RUNNER_TEMP/ct-check.log" ]; then
              sed -n 's/.*ct_check row //p' "$RUNNER_TEMP/ct-check.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dcrec:
    name: constant time, dcrec (${{ matrix.arch }}, ${{ matrix.tables }})
    # dcroxide-dcrec's targets, unless a dispatch picks tlscrypto's alone.
    if: inputs.suite != 'tlscrypto'
    # 13 targets, each running for its budget, twice per architecture (the
    # matrix's two builds): at 10 s, about 2.5 minutes a job after the
    # build; at 60 s, nightly and on dispatch, about 14. A dispatch's cap of
    # 90 s for every target takes about 20 minutes, and 1800 s for one
    # about 31, within the hour.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The architectures the legs name: all of them unless a dispatch
        # picks some, x86_64 for any x86_64 leg and arm64 for any arm64 one.
        # dcrec has no backend to force, so a -soft leg is its plain one.
        arch: >-
          ${{ fromJSON(
          contains(inputs.legs, 'x86_64') && '["x86_64"]'
          || contains(inputs.legs, 'arm64') && '["arm64"]'
          || '["x86_64","arm64"]') }}
        # With the precomputed basepoint table, dcrec's default, and
        # without it, where k256 multiplies by `lincomb`: the two paths a
        # secret scalar can take to the generator's multiple.
        tables: [table, no-table]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      # The budget, as the first job sets it: 10 s a target on pushes and
      # pull requests, 60 s nightly and on dispatch unless it says. At
      # 10 s the harness takes about 600,000 samples of the 15 µs
      # multiply on an x86_64 desktop (about 485,000 at 19 µs on a busy
      # one), and 230,000 to 400,000 of a 25 to 40 µs signature. dcrec's
      # copy of the harness gives the random class and each fixed class
      # the same share, so each of the multiply's 25 classes (24 fixed,
      # the placebo among them) gets about 24,000 samples: a comparison
      # of 24,000 against 24,000 is as precise as the 12,500 against
      # 300,000 of half the samples random, and a neighbour's bursts on
      # the pinned processor cannot lean a small class against a large
      # one. The planted leaks of ADR-0017's second addendum of
      # 2026-11-19 measure what that finds, and the nightly's six times
      # as many samples see differences about 2.4 times smaller. The
      # control's |t| follows a run's load more than its budget: about 50
      # to 2,700 at 10 s on that desktop.
      DCROXIDE_CT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && (inputs.seconds || '60') || github.event_name == 'schedule' && '60' || '10' }}
      CT_TARGET: ${{ inputs.target }}
      CT_SUITE: ${{ inputs.suite }}
      CT_DIT: ${{ matrix.arch == 'arm64' && inputs.dit == 'on' && 'on' || 'off' }}
      # dcrec's default features, or none: `precomputed-tables` is its one
      # feature.
      CT_FEATURES: ${{ matrix.tables == 'no-table' && '--no-default-features' || '' }}
    steps:
      # The first job's check, the same patterns and caps.
      - name: Check the dispatch's inputs
        id: inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          export LC_ALL=C
          if [ -n "$CT_TARGET" ] && ! [[ $CT_TARGET =~ ^[a-z][a-z0-9_]{0,63}$ ]]; then
            echo "::error::target is not a test name such as public_key"
            exit 1
          fi
          if [ -n "$CT_TARGET" ] && [ "$CT_SUITE" = both ]; then
            echo "::error::a target needs the suite it belongs to, tlscrypto or dcrec"
            exit 1
          fi
          if [ -n "$CT_TARGET" ]; then cap=1800; else cap=90; fi
          if ! [[ $DCROXIDE_CT_SECONDS =~ ^[1-9][0-9]{0,4}$ ]] || [ "$DCROXIDE_CT_SECONDS" -gt "$cap" ]; then
            echo "::error::seconds is not a whole number from 1 to $cap"
            exit 1
          fi
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: dcrec-${{ matrix.arch }}-${{ matrix.tables }}
      # Built first, so that the timed step compiles nothing. CT_FEATURES
      # is one flag or none, so it is left unquoted.
      - name: Build the check
        run: cargo test -p dcroxide-dcrec --release --lib --locked $CT_FEATURES --no-run
      - name: Build the DIT switch
        if: env.CT_DIT == 'on'
        run: rustc --edition 2024 --crate-type cdylib -o "$RUNNER_TEMP/libdit-on.so" .github/dit-on.rs
      # The machine, as the first job describes it, without the DIT probe,
      # which that job's arm64 legs already run on the same runner image.
      - name: Describe the processor
        continue-on-error: true
        run: |
          lscpu
          uname -r
          nproc
          grep -E '^(CPU (implementer|architecture|variant|part|revision)|vendor_id|cpu family|model|model name|stepping|microcode)[[:space:]]*:' /proc/cpuinfo | sort | uniq -c
      # One target at a time, in release mode, as the first job runs its
      # own, by the same rule: a target fails when a fixed class's |t| is
      # above 10 on a difference of 1 ns an operation or more, or on too
      # few samples, and the control fails unless its leak fails so. There
      # is no known report here. Each target's row names the
      # multiplication path, "(table)" or "(no table)".
      #
      # Pinned to the runner's last processor with taskset: the test binary
      # and its threads may run there only, so the scheduler never moves a
      # timed operation from one processor to another mid-sample, and each
      # target's trace line "ct_check run |" ends with the processors the
      # thread was allowed, one when the pin held. The pin does not keep
      # other work off that processor: whatever else the scheduler puts
      # there lands in the timed samples, as rare slow outliers. What
      # keeps those from failing a class is the harness: it interleaves
      # the classes sample by sample, so an outlier falls on a class by
      # chance, and gives every class an equal share, so a class that
      # happens to get none of them does not lean far from the random
      # class (crates/dcroxide-testutil/src/ct.rs says why, and ADR-0017's
      # second addendum of 2026-11-19 gives the runs that showed it). The
      # crops do not guard against them, since the uncropped test and the
      # crops whose threshold is the warm-up's slowest times keep them
      # and still count.
      #
      # A dispatch's target is looked up first, as in the first job, in
      # dcrec's own list.
      - name: Time the targets
        run: |
          set -o pipefail
          if [ "$CT_DIT" = on ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="env LD_PRELOAD=$RUNNER_TEMP/libdit-on.so"
          fi
          if [ -n "$CT_TARGET" ]; then
            filter="ct_check::$CT_TARGET"
            exact=(--exact)
            listed=$(cargo test -p dcroxide-dcrec --release --lib --locked $CT_FEATURES "$filter" -- \
              --ignored --list --exact)
            if ! grep -qFx "$filter: test" <<< "$listed"; then
              echo "::error::no dcrec ct_check target is named $CT_TARGET"
              exit 1
            fi
          else
            filter=ct_check
            exact=()
          fi
          cpu=$(( $(nproc) - 1 ))
          taskset -c "$cpu" cargo test -p dcroxide-dcrec --release --lib --locked $CT_FEATURES "$filter" -- \
            --ignored --test-threads=1 --nocapture "${exact[@]}" 2>&1 | tee "$RUNNER_TEMP/ct-check.log"
          if [ "$CT_DIT" = on ] && ! { grep -q 'ct_check dit | PSTATE.DIT read [01] at load, 1 once set, 1 in a new thread' "$RUNNER_TEMP/ct-check.log" \
              && grep -q 'ct_check dit | PSTATE.DIT read 1 at exit' "$RUNNER_TEMP/ct-check.log"; }; then
            echo "::error::DIT was asked for, and the log does not show it on"
            exit 1
          fi
      # The first job's summary, its columns the same, under a heading
      # that names the build.
      - name: Summarize the run
        if: always() && steps.inputs.outcome != 'failure'
        run: |
          dit=
          if [ "$CT_DIT" = on ]; then
            if grep -q 'ct_check dit | PSTATE.DIT read [01] at load, 1 once set, 1 in a new thread' "$RUNNER_TEMP/ct-check.log" 2> /dev/null \
              && grep -q 'ct_check dit | PSTATE.DIT read 1 at exit' "$RUNNER_TEMP/ct-check.log"; then
              dit=", DIT on"
            else
              dit=", DIT asked for, not shown on"
            fi
          fi
          {
            if [ -n "$CT_TARGET" ]; then
              echo "### dcrec, ${{ matrix.arch }}, ${{ matrix.tables }}, ${CT_TARGET} alone, ${DCROXIDE_CT_SECONDS} s${dit}"
            else
              echo "### dcrec, ${{ matrix.arch }}, ${{ matrix.tables }}, ${DCROXIDE_CT_SECONDS} s a target${dit}"
            fi
            echo
            echo "| target | t | effect | ns/op | difference | class | test | fixed | random | samples | batch | verdict |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            if [ -f "$RUNNER_TEMP/ct-check.log" ]; then
              sed -n 's/.*ct_check row //p' "$RUNNER_TEMP/ct-check.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
