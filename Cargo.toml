[workspace]
resolver = "3"
members = [
    "crates/dcroxide-addrmgr",
    "crates/dcroxide-base58",
    "crates/dcroxide-bench",
    "crates/dcroxide-blockchain",
    "crates/dcroxide-certgen",
    "crates/dcroxide-chaincfg",
    "crates/dcroxide-chainhash",
    "crates/dcroxide-connmgr",
    "crates/dcroxide-containers",
    "crates/dcroxide-crypto",
    "crates/dcroxide-database",
    "crates/dcroxide-dcrec",
    "crates/dcroxide-dcrjson",
    "crates/dcroxide-fees",
    "crates/dcroxide-gcs",
    "crates/dcroxide-indexers",
    "crates/dcroxide-mempool",
    "crates/dcroxide-mining",
    "crates/dcroxide-mixing",
    "crates/dcroxide-netsync",
    "crates/dcroxide-node",
    "crates/dcroxide-peer",
    "crates/dcroxide-ratelimit",
    "crates/dcroxide-rpc",
    "crates/dcroxide-rpctypes",
    "crates/dcroxide-stake",
    "crates/dcroxide-standalone",
    "crates/dcroxide-testutil",
    "crates/dcroxide-txscript",
    "crates/dcroxide-uint256",
    "crates/dcroxide-winsvc",
    "crates/dcroxide-wire",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
authors = ["The dcroxide developers"]
edition = "2024"
rust-version = "1.88"
license = "ISC"
repository = "https://github.com/jzbz/dcroxide"

# Release binaries trade compile time for runtime: single codegen unit
# with thin LTO, and line tables kept for profiling (`perf`).
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
# A panic terminates the process instead of unwinding.
#
# Rust mutexes poison on panic and Go's `sync.Mutex` does not, so dcrd
# recovers per goroutine where this port cannot: a panic on one thread
# poisons every lock it held, and each other consumer of those locks then
# dies on `.expect("... poisoned")` in turn.  Unwinding also let the RPC
# layer's `catch_unwind` keep the process alive answering canned errors,
# so the node wedged while looking healthy and `Restart=on-failure` never
# fired.
#
# Aborting is the honest choice for a consensus daemon: we cannot reason
# about state a panic left half-mutated, so a supervisor restarting a
# clean node beats continuing on unknown state.  The cost is that any
# reachable panic becomes an outage until restart -- loud instead of
# silent, which is what we want.
#
# Dev and test builds keep unwinding: the test harness requires it, and
# several suites use `#[should_panic]` or `catch_unwind` deliberately.
# That also means the `catch_unwind` guards in rpcrun.rs and
# websocket.rs are inert in release builds and only meaningful under
# `cargo test`.
panic = "abort"

# The profile release artifacts are cut from.
#
# `release` deliberately carries debug info so `perf` can symbolicate a
# profile, and that is 41.5 MB of the 50.1 MB binary — the machine code
# itself is 6.3 MB, near-identical to dcrd's 6.4 MB.  Shipping that to
# operators serves nobody, so this profile drops it.
#
# `strip = "debuginfo"` rather than `"symbols"`, which would be ~1-2 MB
# smaller: the symbol table stays so a panic still names functions in its
# backtrace.  With `panic = "abort"` inherited from `release`, a panic is
# a process death and an outage, and that backtrace is the whole
# diagnostic — worth more than the megabyte.  Line numbers do go; if a
# release ever needs those, `split-debuginfo = "packed"` keeps them in a
# `.dwp` sidecar instead.
#
#   cargo build --profile dist -p dcroxide-node --bin dcroxide
#   # -> target/dist/dcroxide
[profile.dist]
inherits = "release"
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
