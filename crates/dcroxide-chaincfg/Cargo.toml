[package]
name = "dcroxide-chaincfg"
description = "Decred network parameters mirroring dcrd's chaincfg: genesis blocks, consensus agendas, and per-network constants"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
dcroxide-crypto = { path = "../dcroxide-crypto" }
# For the `SubsidyParams` impl on `Params` (dcrd's `*chaincfg.Params`
# satisfies `standalone.SubsidyParams` through its accessor methods).
# This direction keeps standalone free of the chain parameters, as
# dcrd's `blockchain/standalone` module is (its go.mod requires only
# chainhash and wire).
dcroxide-standalone = { path = "../dcroxide-standalone" }
dcroxide-uint256 = { path = "../dcroxide-uint256" }
dcroxide-wire = { path = "../dcroxide-wire" }

[dev-dependencies]
dcroxide-testutil = { path = "../dcroxide-testutil" }

[lints]
workspace = true
