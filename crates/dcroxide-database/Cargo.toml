[package]
name = "dcroxide-database"
description = "Block and metadata storage mirroring dcrd's database interface semantics: bucketed transactional metadata plus flat-file block storage, backed by redb per ADR-0004"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
dcroxide-wire = { path = "../dcroxide-wire" }
crc = "3.4"
redb = "4"

[dev-dependencies]
crc = "3.4"
dcroxide-testutil = { path = "../dcroxide-testutil" }
# The same crate as above, with its counter of hashed headers for the
# test that a block stored under a hash in hand is not hashed again.
dcroxide-wire = { path = "../dcroxide-wire", features = ["count-header-hashes"] }
tempfile = "3"

[lints]
workspace = true
