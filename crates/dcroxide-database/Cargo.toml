[package]
name = "dcroxide-database"
description = "Block and metadata storage mirroring dcrd's database interface semantics: bucketed transactional metadata plus flat-file block storage, backed by redb per ADR-0004"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
dcroxide-wire = { path = "../dcroxide-wire" }
crc = "3"
redb = "4"

[dev-dependencies]
crc = "3"
dcroxide-testutil = { path = "../dcroxide-testutil" }
# The previous major, to write a file in the old on-disk format so the
# upgrade test can prove the new one refuses it legibly rather than
# misreading it. Test-only: it is not linked into the daemon.
redb2 = { package = "redb", version = "=2.6.3" }
tempfile = "3"

[lints]
workspace = true
