[package]
name = "dcroxide-dcrec"
description = "Decred signature types mirroring dcrd's dcrec packages: ECDSA-secp256k1, Ed25519 and EC-Schnorr-DCRv0 with dcrd's exact acceptance rules"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pure-Rust secp256k1 arithmetic: private keys, ECDSA and EC-Schnorr-DCRv0
# signing, and the fallbacks of verification, recovery and key parsing,
# with dcrd's exact rules enforced by this crate's own code (ADR-0006's
# 2026-10-26 addendum, ADR-0012).  The variable-time arithmetic of ECDSA
# verification, compact recovery and Schnorr verification, and public
# keys, is dcroxide-secp256k1-vartime's, below, with k256's as its fallback.
#
# k256's `std` and `precomputed-tables` are deliberately left off.  ECDSA
# and Schnorr signing, and `PrivateKey::public_key`, multiply with
# `ProjectivePoint::GENERATOR * k` (or `* d`), which goes through
# `lincomb`.  The seam's fallbacks use k256's combined multiply
# `mul_by_generator_and_mul_add_vartime`.  None reads k256's basepoint
# table -- only `mul_by_generator` and `mul_by_generator_vartime` do, and
# this crate calls neither -- so k256's tables would buy nothing, and from
# 0.14 `k256/std` also pulls an OS RNG (getrandom) into a crate that never
# draws randomness.
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# RFC6979 nonce generation (dcrd's exact variant, ported in this crate).
# `zeroize` on both: each HMAC the nonce's DRBG runs holds two SHA-2
# states keyed by its K and a block buffer the private key's bytes pass
# through, which `sha2`'s feature wipes on drop, the buffer through
# `digest`'s, which `hmac`'s turns on as well (`src/secp256k1/nonce.rs`).
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Wipes the temporary private key copies signing makes, as dcrd zeroes its own.
zeroize = { version = "1.9", default-features = false }
# Variable-time secp256k1 arithmetic on public values, owned in tree and
# ported from libsecp256k1 (ADR-0016): ECDSA verification's steps 2-10,
# compact recovery's steps 4-10 and Schnorr verification's steps 7-10
# (scalars, the Straus loop over static generator tables, the x check and
# the affine conversion), and public keys: compressed keys' decompression
# by the 5x52 field's square root, the curve check and serialization.
# Only `src/secp256k1/backend.rs` names it, and k256's path stays behind
# it as the fallback.  It has no dependencies of its own and needs only
# core; its licence is ISC AND MIT (its NOTICE).
dcroxide-secp256k1-vartime = { path = "../dcroxide-secp256k1-vartime" }
# Ed25519 group/scalar primitives; dcrd's exact (2017-agl) acceptance
# behavior is implemented in our edwards module on top of these.
curve25519-dalek = "5"
# BLAKE-256 for the EC-Schnorr-DCRv0 challenge.
dcroxide-crypto = { path = "../dcroxide-crypto" }

[dev-dependencies]
dcroxide-testutil = { path = "../dcroxide-testutil" }

[lints]
workspace = true
