[package]
name = "dcroxide-dcrec"
description = "Decred signature types mirroring dcrd's dcrec packages: ECDSA-secp256k1, Ed25519 and EC-Schnorr-DCRv0 with dcrd's exact acceptance rules"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Pure-Rust secp256k1 arithmetic: every key, ECDSA verification, signing
# and compact recovery, and EC-Schnorr-DCRv0, with dcrd's exact parsing and
# acceptance rules enforced by this crate's own code (ADR-0006's 2026-10-26
# addendum, ADR-0012).  The scalar inverse of verification and recovery,
# and the decompression of compressed keys and of recovery's R, are
# dcroxide-secp256k1-vartime's, below, with k256's as their fallback.
#
# k256's `std` and `precomputed-tables` are deliberately left off.  ECDSA
# and Schnorr signing, and `PrivateKey::public_key`, multiply with
# `ProjectivePoint::GENERATOR * k` (or `* d`), which goes through
# `lincomb`.  ECDSA verification and recovery, and Schnorr verification,
# compute their sum with this crate's own variable-time loop over k256's
# public point operations (`src/secp256k1/ecmult.rs`), which keeps static
# tables of G and 2^128*G of its own.  None reads k256's basepoint table
# -- only `mul_by_generator` and `mul_by_generator_vartime` do, and this
# crate calls neither -- so k256's tables would buy nothing, and from 0.14
# `k256/std` also pulls an OS RNG (getrandom) into a crate that never
# draws randomness.
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# The first-use cell of those static generator tables: `race::OnceBox`
# needs only core atomics and `alloc`, so default features stay off and
# building this crate alone takes no `std`.  Already in both locks (rustls
# takes it in both), so it adds no package.
once_cell = { version = "1.21", default-features = false, features = ["alloc"] }
# RFC6979 nonce generation (dcrd's exact variant, ported in this crate).
# `zeroize` on both: each HMAC the nonce's DRBG runs holds two SHA-2
# states keyed by its K and a block buffer the private key's bytes pass
# through, which `sha2`'s feature wipes on drop, the buffer through
# `digest`'s, which `hmac`'s turns on as well (`src/secp256k1/nonce.rs`).
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# Wipes the temporary private key copies signing makes, as dcrd zeroes its own.
zeroize = { version = "1.9", default-features = false }
# Variable-time secp256k1 arithmetic on public values, owned in tree and
# ported from libsecp256k1 (ADR-0016): today the scalar inverse of ECDSA
# verification (s^-1) and compact recovery (r^-1), by safegcd, and the
# decompression of compressed keys and of recovery's R, by the 5x52
# field's square root.  Only `src/secp256k1/backend.rs` names it, and
# k256's path stays behind it as the fallback.  It has no dependencies of
# its own and needs only core; its licence is ISC AND MIT (its NOTICE).
dcroxide-secp256k1-vartime = { path = "../dcroxide-secp256k1-vartime" }
# Ed25519 group/scalar primitives; dcrd's exact (2017-agl) acceptance
# behavior is implemented in our edwards module on top of these.
curve25519-dalek = "5"
# BLAKE-256 for the EC-Schnorr-DCRv0 challenge.
dcroxide-crypto = { path = "../dcroxide-crypto" }

[dev-dependencies]
dcroxide-testutil = { path = "../dcroxide-testutil" }

[lints]
workspace = true
