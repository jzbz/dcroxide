[package]
name = "dcroxide-dcrec"
description = "Decred signature types mirroring dcrd's dcrec packages: ECDSA-secp256k1 with dcrd's exact acceptance rules"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# `std` buys one pure-performance choice and nothing semantic.  secp256k1
# runs its key, sign, verify and recover functions against a context it
# manages itself: with `std`, one per thread, allocated on first use; without
# it, one built on the stack for every call.  Every acceptance rule, error
# identity, and byte encoding is identical either way, which the crate's own
# vectors run in both configurations.
#
# k256's `std` and `precomputed-tables` are deliberately left off.  Schnorr
# signing multiplies with `ProjectivePoint::GENERATOR * k`, which goes
# through `lincomb`.  Verification uses `mul_by_generator_and_mul_add_vartime`,
# a GLV/wNAF pass over the generator and the key.  Neither reads the
# basepoint table -- only `mul_by_generator` and `mul_by_generator_vartime`
# do, and the Schnorr code calls neither -- so the tables bought nothing,
# and from 0.14 `k256/std` also pulls an OS RNG (getrandom) into a crate
# that never draws randomness.
std = ["libsecp256k1/std"]

[dependencies]
# The audited libsecp256k1 C library; dcrd's exact parsing/acceptance rules
# are enforced by our own layer in front of it (ADR-0006).
libsecp256k1 = { package = "secp256k1", version = "0.33", default-features = false, features = ["recovery"] }
# Pure-Rust scalar/point arithmetic for EC-Schnorr-DCRv0, which needs raw
# group operations no packaged signing API exposes (ADR-0006).
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
# RFC6979 nonce generation (dcrd's exact variant, ported in this crate).
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Ed25519 group/scalar primitives; dcrd's exact (2017-agl) acceptance
# behavior is implemented in our edwards module on top of these.
curve25519-dalek = "5"
# BLAKE-256 for the EC-Schnorr-DCRv0 challenge.
dcroxide-crypto = { path = "../dcroxide-crypto" }

[dev-dependencies]
dcroxide-testutil = { path = "../dcroxide-testutil" }

[lints]
workspace = true
