[package]
name = "dcroxide-fees"
description = "Smart fee estimation mirroring dcrd's internal/fees package"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["precomputed-tables"]
# dcroxide-stake's feature of the same name, and through it
# dcroxide-txscript's and dcroxide-dcrec's: k256's basepoint table for
# secret generator multiplication, which takes std with it.  On by
# default, so every build that names this crate with its defaults is
# unchanged; `--no-default-features` (CI's no_std check) leaves the
# table's std out, with the same results.  The crate signs nothing: the
# feature only passes the choice through, as dcroxide-txscript does for
# dcroxide-dcrec.
precomputed-tables = ["dcroxide-stake/precomputed-tables"]

[dependencies]
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
# Without its `storage` feature: the estimator takes only `TxType` and
# never opens the ticket database, so this crate reaches neither
# dcroxide-database nor redb.  The node's build turns the feature on
# through dcroxide-blockchain and the crates that take stake with its
# defaults (dcroxide-node, dcroxide-mempool, dcroxide-mining,
# dcroxide-indexers), so this changes nothing there.
dcroxide-stake = { path = "../dcroxide-stake", default-features = false }

[dev-dependencies]
dcroxide-testutil = { path = "../dcroxide-testutil" }

[lints]
workspace = true
