[package]
name = "dcroxide-node"
description = "Daemon assembly mirroring dcrd's package main, starting with the configuration pipeline"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dcroxide"
path = "src/bin/dcroxide.rs"

[[bin]]
name = "addblock"
path = "src/bin/addblock.rs"

[[bin]]
name = "promptsecret"
path = "src/bin/promptsecret.rs"

[[bin]]
name = "gencerts"
path = "src/bin/gencerts.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
dcroxide-addrmgr = { path = "../dcroxide-addrmgr" }
dcroxide-blockchain = { path = "../dcroxide-blockchain", features = ["std"] }
dcroxide-certgen = { path = "../dcroxide-certgen" }
dcroxide-uint256 = { path = "../dcroxide-uint256" }
dcroxide-database = { path = "../dcroxide-database" }
dcroxide-connmgr = { path = "../dcroxide-connmgr" }
dcroxide-containers = { path = "../dcroxide-containers" }
dcroxide-crypto = { path = "../dcroxide-crypto", features = ["rand"] }
dcroxide-chaincfg = { path = "../dcroxide-chaincfg" }
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
dcroxide-dcrjson = { path = "../dcroxide-dcrjson" }
dcroxide-fees = { path = "../dcroxide-fees" }
dcroxide-indexers = { path = "../dcroxide-indexers" }
dcroxide-mempool = { path = "../dcroxide-mempool" }
dcroxide-mixing = { path = "../dcroxide-mixing" }
dcroxide-mining = { path = "../dcroxide-mining" }
dcroxide-netsync = { path = "../dcroxide-netsync" }
dcroxide-stake = { path = "../dcroxide-stake" }
dcroxide-standalone = { path = "../dcroxide-standalone" }
dcroxide-peer = { path = "../dcroxide-peer" }
dcroxide-rpc = { path = "../dcroxide-rpc" }
dcroxide-txscript = { path = "../dcroxide-txscript" }
dcroxide-wire = { path = "../dcroxide-wire" }
# The in-tree rustls crypto provider (ADR-0015), the one the node's TLS
# runs on: the RPC listener's configurations (`rpctls`), its key loading
# and client-certificate verifier (`rpcrun`), and both seeder clients
# (`seeding`) each name it.
dcroxide-tlscrypto = { path = "../dcroxide-tlscrypto" }
# No provider of rustls's own: default features would pull aws-lc-rs, a
# 68 MB C and assembly crypto library in a workspace that otherwise
# forbids unsafe code, and `ring` is C and assembly too (ADR-0012).
# `custom-provider` turns off rustls's fallback to a provider its crate
# features name, so every configuration names `dcroxide-tlscrypto`'s and
# none takes a process default, which the node never installs (ADR-0015;
# `tests/no_process_provider.rs`).
rustls = { version = "0.23.45", default-features = false, features = [
    "std",
    "tls12",
    "logging",
    "custom-provider",
] }
sha1 = { version = "0.11", default-features = false }
rustls-pki-types = "1"
# The webpki rustls verifies certificates with, called directly by the
# RPC client certificate verifier (`rpcrun::GoClientCertVerifier`) for
# the path callback and extended key usage check rustls's own client
# verifier does not take.  Already in the tree through rustls at this
# version; 0.103.16 is also the floor RUSTSEC-2026-0382 sets.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
# Gzips the log file's rolls, as dcrd's rotator does with Go's
# `compress/gzip` (`logrotate.rs`).  Already in the tree with its
# default features through ureq's gzip support, so it adds no crate.
flate2 = "1.1"
# Exact: the seeder transport hands ureq its rustls provider through
# `TlsConfigBuilder::unversioned_rustls_crypto_provider`, which ureq does
# not keep across its minor versions (`ureq-3.5.1/src/tls/mod.rs:248-256`),
# so ADR-0015's T7 pins it while the node relies on that call.  Its
# default `rustls` feature turns on rustls's `ring` (`_ring`,
# `ureq-3.5.1/Cargo.toml:63`, `:101-105`); `rustls-no-provider` is the
# same client without it, beside the default's `gzip` and the
# `webpki-roots` the daemon's seeders trust.
ureq = { version = "=3.5.1", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
    "gzip",
] }
webpki-roots = "1.0.10"
socket2 = "0.6.4"
# Wipes the `rpc.key` block's DER, not the PEM text it came from, once
# the provider has loaded it (`rpcrun::go_key_block`), as its
# `KEY_PROVIDER` wipes a key.  Locked already, by the provider and rustls.
zeroize = "1.9"

# Already in the tree via socket2 and getrandom; taken directly for
# MSG_DONTWAIT, which lets the request-cancellation watchdog peek at a
# connection without changing the socket state the handler depends on.
#
# rustix supplies the POLLRDHUP that peek cannot: a TLS peer writes a
# close_notify before closing, so pending bytes hide the FIN from a peek
# but not from RDHUP.  It is a safe wrapper -- the workspace forbids
# unsafe_code -- and adds no crate the lockfile did not already carry:
# rustix and linux-raw-sys arrive via tempfile for tests, and bitflags
# already ships through nix.  Only the `event` API is enabled, plus
# `process` for the safe `getrlimit`/`setrlimit` behind the descriptor
# limit raise dcrd gets from the Go runtime and `limits.SetLimits`
# (`limits.rs`); that feature only turns on linux-raw-sys's `prctl`
# module, so it adds no crate either.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.4", default-features = false, features = ["std", "event", "process"] }

# The kqueue half of the same problem, for the platforms rustix gates
# POLLRDHUP away from.  nix is the only safe wrapper available: rustix's
# own `kevent` is `pub unsafe fn`, which the workspace forbids.  It is
# already in the tree as a real dependency through ctrlc, and `event` is
# an empty feature list, so this adds no crate and no code beyond the
# module itself.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["event"] }

# The same safe poll the unix arm uses: rustix routes it to WSAPoll on
# Windows (`backend/libc/winsock_c.rs` aliases `WSAPoll as poll`), and
# only its `RDHUP` flag is gated away, not `poll` itself.  Every crate
# this pulls -- rustix, errno, windows-sys -- is already pinned in the
# lockfile through ctrlc, socket2, tempfile and windows-service.
[target.'cfg(windows)'.dependencies]
dcroxide-winsvc = { path = "../dcroxide-winsvc" }
rustix = { version = "1.1.4", default-features = false, features = ["std", "event"] }

[dev-dependencies]
dcroxide-dcrec = { path = "../dcroxide-dcrec" }
dcroxide-testutil = { path = "../dcroxide-testutil" }
# The same crate as above, with its counter of hashed headers for the
# test that a block's hash travels with it from its reader to the chain.
dcroxide-wire = { path = "../dcroxide-wire", features = ["count-header-hashes"] }
# A TLS client's side of P-521 in `tests/rpclisten.rs`: it verifies the
# server's P-521 handshake signatures and runs a P-521 key exchange
# against it.  The server's side is `dcroxide-tlscrypto`'s.  The same
# version as that crate's and `dcroxide-certgen`'s.
p521 = { version = "0.14", default-features = false, features = ["ecdsa"] }
# The JSON the oracle's TLS commands take and answer with, in
# `tests/tls_interop.rs`; the version `dcroxide-testutil` locks already.
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
