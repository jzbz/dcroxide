[package]
name = "dcroxide-secp256k1-vartime"
description = "Variable-time secp256k1 arithmetic on public data for dcroxide-dcrec, ported from libsecp256k1"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not the workspace's ISC alone: the arithmetic is translated from
# libsecp256k1, which is MIT; NOTICE carries its licence and copyright
# lines, and each derived file says so in its header (ADR-0016).
license = "ISC AND MIT"
repository.workspace = true

# No [dependencies]: the crate builds on core alone, with no alloc.

[features]
# Re-exports the field types (doc-hidden) for the fuzz target's field
# level, and nothing else: no code, no dependency, no change in behaviour.
# No workspace crate turns it on.
internals = []

[dev-dependencies]
# The references the tests compare against, each of a different origin
# from the port and all already locked: crypto-bigint's modular
# arithmetic, k256's scalar, field and point arithmetic (RustCrypto),
# fiat-crypto's machine-checked Dettman multiplication and squaring, the
# limb-exact oracle for the field kernel, and testutil's SplitMix64 for
# fixed-seed inputs.  sha2 hashes libsecp256k1's ecmult known-answer
# tests' points and makes their scalars.
crypto-bigint = { version = "0.7", default-features = false }
dcroxide-testutil = { path = "../dcroxide-testutil" }
fiat-crypto = { version = "0.3", default-features = false }
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
