[package]
name = "dcroxide-sigdiff"
description = "Development-only signature differential soak: named input classes, a pipelined client for tools/oracle and the sigsoak binary (no dcrd counterpart; not for release)"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The code under test.  src/ours.rs is the only module that names it.
dcroxide-dcrec = { path = "../dcroxide-dcrec" }
# BLAKE-256: the EC-Schnorr-DCRv0 challenge the generators compute, the
# soak's digests and the generator fingerprint.
dcroxide-crypto = { path = "../dcroxide-crypto" }
# SplitMix64 and its derive, the oracle binary and its skip policy, the
# parity pin and its pseudo-version rule, hex.
dcroxide-testutil = { path = "../dcroxide-testutil" }
# The generators' and models' own arithmetic, at the versions and features
# dcroxide-dcrec takes, so the workspace builds no second copy or feature set:
# secp256k1 on k256, Ed25519 on curve25519-dalek with SHA-512 for its
# challenge.
k256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
curve25519-dalek = "5"
sha2 = { version = "0.11", default-features = false }
serde_json = "1"

# The fake oracle in this test is the test binary itself, run as a child
# that speaks the oracle's protocol on its stdout.  libtest writes its own
# lines there ("running 1 test"), which would break the protocol, so this
# one test brings its own main.
[[test]]
name = "pipe_fake_oracle"
harness = false

[lints]
workspace = true
