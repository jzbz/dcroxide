[package]
name = "dcroxide-stake"
description = "Decred stake transaction primitives mirroring dcrd's blockchain/stake: classification, rule checks, and the ticket lottery"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["storage", "precomputed-tables"]
# The `stakedb` module: dcrd's `Db*` functions and the entry points that
# read and write the node's ticket database (`InitDatabaseState`,
# `LoadBestNode`, `WriteConnectedBestNode`, `WriteDisconnectedBestNode`),
# and with it the one dependency on dcroxide-database, and through that
# on redb.  On by default, so every build that names this crate as it
# always has is unchanged; dcroxide-blockchain, which calls `stakedb`,
# also asks for it by name.  Off (`default-features = false`), the crate
# is the storage-free part of dcrd's package: transaction classification
# and rule checks, the treasury checks, commitment and vote extraction,
# reward calculation, the ticket lottery, and the in-memory ticket
# treap, row formats and stake node.  dcroxide-gcs, dcroxide-fees and
# dcroxide-rpc take it that way, and so can a wallet: everything
# dcrwallet imports from `blockchain/stake` is in it.  The feature adds
# one public module, `stakedb`, and with it three crate-private
# `ticketnode::Node` helpers that only `stakedb` calls (`missed_treap`,
# `revoked_treap`, `from_database_state`); no public item outside
# `stakedb` changes.
storage = ["dep:dcroxide-database"]
# dcroxide-txscript's default feature, and through it dcroxide-dcrec's:
# k256's basepoint table for secret generator multiplication, which takes
# std with it.  On by default, so every build that names this crate with
# its defaults is unchanged; `--no-default-features` (CI's no_std check,
# with `storage` off too) leaves the table's std out, with the same
# results.  The crate signs nothing itself: the feature only passes the
# choice through, as dcroxide-txscript does for dcroxide-dcrec.
precomputed-tables = ["dcroxide-txscript/precomputed-tables"]

[dependencies]
dcroxide-chainhash = { path = "../dcroxide-chainhash" }
dcroxide-database = { path = "../dcroxide-database", optional = true }
# Default features off so a no_std build can leave out the table's std;
# `precomputed-tables` above turns it back on.
dcroxide-txscript = { path = "../dcroxide-txscript", default-features = false }
dcroxide-uint256 = { path = "../dcroxide-uint256" }
dcroxide-wire = { path = "../dcroxide-wire" }

[dev-dependencies]
tempfile = "3"
dcroxide-chaincfg = { path = "../dcroxide-chaincfg" }
dcroxide-testutil = { path = "../dcroxide-testutil" }

# The three test targets that open a ticket database through `stakedb`.
# Every other target builds and runs with `--no-default-features`, as
# CI's storage-gate job runs them.
[[test]]
name = "review_stake_height_gates"
required-features = ["storage"]

[[test]]
name = "review_stakedb_integrity"
required-features = ["storage"]

[[test]]
name = "stakedb_vectors"
required-features = ["storage"]

[lints]
workspace = true
