[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "ISC",
    "MIT",
    "Apache-2.0",
    # BSD-2-Clause was dropped when blake3 1.8.7 stopped needing arrayref,
    # the only crate carrying it; an allowance nothing matches is the dead
    # config the bans note below argues against, so it goes until a crate
    # brings it back.
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    # The Mozilla CA certificate bundle shipped by webpki-roots (rustls).
    "CDLA-Permissive-2.0",
]

[bans]
# A new duplicate should fail the build, which is only meaningful once
# the ones already in cargo-deny's graph are listed below.  Under "warn"
# a fresh duplicate is just a second warning nobody reads.  Flipping to
# "deny" is safe because Cargo.lock is committed, so the check is
# deterministic and can only trip on a deliberate lockfile change.
#
# cargo-deny ignores versions reachable only through dev-dependencies
# (bans.multiple-versions-include-dev has defaulted to false since
# 0.14.2).  proptest, the dev-dependency that brought rand_core 0.9,
# getrandom 0.3 and r-efi 5 through rand 0.9, takes rand 0.10 since 1.12,
# on the rand_core 0.10, getrandom 0.4 and r-efi 6 the rest of the graph
# uses, so it brings no duplicate now.
#
# Semver-range specs rather than exact pins, so a transitive patch bump
# does not turn an entry into an unmatched-skip warning.
multiple-versions = "deny"

# The crypto libraries in C and assembly rustls can take a provider from
# (ADR-0012), refused now that dcroxide-tlscrypto is the node's only one
# (ADR-0015).  Cargo.lock still lists ring, and `cargo metadata`'s
# resolve graph has it under rustls-webpki, whose `alloc` feature names
# the optional `ring?/alloc`: Cargo locks an optional dependency a
# feature names that way, enabled or not.  No build compiles it.
# cargo-deny's graph, which krates builds, follows the features that are
# enabled and leaves out an optional dependency only a `?` feature names
# (krates 0.21.2, src/builder.rs:1222, :1393), so it holds no ring, and
# this ban fires only if something turns one on.  So too getrandom 0.2
# and windows-sys 0.52, which only ring takes: the lock keeps them beside
# 0.4 and 0.61, the graph does not, and they have no skip.  Were krates
# to keep ring, this ban and those two duplicates would fail the check.
#
# The rest refuse C where a build gets it (ADR-0012).  cargo-deny
# matches a ban by name and version, with no patterns, so a -sys crate
# is refused through the driver it builds or finds its C with: cc, which
# runs a C or C++ compiler from a build script; cmake; pkg-config and
# vcpkg, which find a C library to link; and bindgen, which reads C
# headers through libclang.  Only cc is in the lock.  secp256k1-sys,
# which left when secp256k1 moved to k256, is refused by name as well.
# A ban lets a crate through only when every crate that takes it
# directly is one of its wrappers, so a new crate that takes cc fails
# the check.  In cargo-deny's graph cc's only takers are its two
# wrappers (the lock's ring, which no build takes, lists it too):
# blake3, whose build script still asks the C compiler about two
# AVX-512 flags, and warns when none answers, until BLAKE3 is ported
# into the tree, and whose features are held to `pure` below; and
# iana-time-zone-haiku, which compiles C++ for Haiku alone, a target
# the project does not build for, kept in view here.  A wrapper goes
# with its crate, since cargo-deny warns of one it does not meet.
# A ban that matches nothing is doing its job, unlike an unmatched skip.
# Only this workspace is read: fuzz/, with its own lock, keeps
# libFuzzer's C++, one of ADR-0012's two exceptions.  CI's
# no-c-compiler job checks the rule another way, building every
# workspace target with no C compiler a build script can reach.
deny = [
    { crate = "ring", reason = "C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
    { crate = "aws-lc-rs", reason = "binds aws-lc-sys, C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
    { crate = "aws-lc-sys", reason = "C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
    { crate = "secp256k1-sys", reason = "libsecp256k1's C; secp256k1 runs on k256 and dcroxide-secp256k1-vartime (ADR-0012, ADR-0017)" },
    { crate = "cc", wrappers = ["blake3", "iana-time-zone-haiku"], reason = "runs a C or C++ compiler from a build script (ADR-0012)" },
    { crate = "cmake", reason = "drives a C or C++ build through CMake (ADR-0012)" },
    { crate = "pkg-config", reason = "finds a system C library for a build script to link (ADR-0012)" },
    { crate = "vcpkg", reason = "finds or builds a C or C++ library to link (ADR-0012)" },
    { crate = "bindgen", reason = "reads C headers through libclang, for C a crate compiles or links (ADR-0012)" },
]

# A wrapper is let through cc's ban with any features, so blake3's are
# held to `pure` alone.  Without it blake3's build script compiles C or
# assembly wherever a compiler answers, and on x86_64 does without them
# where none does, so neither the ban nor CI's no-c-compiler job would
# see it.  This entry goes with blake3.
[[bans.features]]
crate = "blake3"
allow = ["pure"]
exact = true
reason = "only `pure` keeps blake3's C and assembly out of a build (ADR-0012)"

[[bans.skip]]
crate = "syn:2"
reason = "the ecosystem is mid-migration to syn 3: serde_derive and wasm-bindgen-macro-support are on 3, while curve25519-dalek-derive, windows-implement and windows-interface still pin 2 -- both majors are present until the laggards move, and neither side is this workspace's to choose"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
