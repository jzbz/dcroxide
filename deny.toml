[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "ISC",
    "MIT",
    "Apache-2.0",
    # BSD-2-Clause was dropped when blake3 1.8.7 stopped needing arrayref,
    # the only crate carrying it; an allowance nothing matches is the dead
    # config the bans note below argues against, so it goes until a crate
    # brings it back.
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    # The Mozilla CA certificate bundle shipped by webpki-roots (rustls).
    "CDLA-Permissive-2.0",
]

[bans]
# A new duplicate should fail the build, which is only meaningful once
# the ones already in cargo-deny's graph are listed below.  Under "warn"
# a fresh duplicate is just a second warning nobody reads.  Flipping to
# "deny" is safe because Cargo.lock is committed, so the check is
# deterministic and can only trip on a deliberate lockfile change.
#
# cargo-deny ignores versions reachable only through dev-dependencies
# (bans.multiple-versions-include-dev has defaulted to false since
# 0.14.2).  proptest, the dev-dependency that brought rand_core 0.9,
# getrandom 0.3 and r-efi 5 through rand 0.9, takes rand 0.10 since 1.12,
# on the rand_core 0.10, getrandom 0.4 and r-efi 6 the rest of the graph
# uses, so it brings no duplicate now.  rand 0.9 and those three stay in
# Cargo.lock only as secp256k1's optional `rand`, which its `std` feature
# names as `rand?/std`; cargo-deny's graph leaves them out for the reason
# it leaves out ring (below), so they have no skip.  A skip for any of
# them would be dead config that cargo-deny reports back as
# unmatched-skip.
#
# Semver-range specs rather than exact pins, so a transitive patch bump
# does not turn an entry into an unmatched-skip warning.
multiple-versions = "deny"

# The crypto libraries in C and assembly rustls can take a provider from
# (ADR-0012), refused now that dcroxide-tlscrypto is the node's only one
# (ADR-0015).  Cargo.lock still lists ring, and `cargo metadata`'s
# resolve graph has it under rustls-webpki, whose `alloc` feature names
# the optional `ring?/alloc`: Cargo locks an optional dependency a
# feature names that way, enabled or not.  No build compiles it.
# cargo-deny's graph, which krates builds, follows the features that are
# enabled and leaves out an optional dependency only a `?` feature names
# (krates 0.21.2, src/builder.rs:1222, :1393), so it holds no ring, and
# this ban fires only if something turns one on.  So too getrandom 0.2
# and windows-sys 0.52, which only ring takes: the lock keeps them beside
# 0.4 and 0.61, the graph does not, and they have no skip.  Were krates
# to keep ring, this ban and those two duplicates would fail the check.
deny = [
    { crate = "ring", reason = "C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
    { crate = "aws-lc-rs", reason = "binds aws-lc-sys, C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
    { crate = "aws-lc-sys", reason = "C and assembly; the node's TLS runs on dcroxide-tlscrypto (ADR-0012, ADR-0015)" },
]

[[bans.skip]]
crate = "syn:2"
reason = "the ecosystem is mid-migration to syn 3: serde_derive and wasm-bindgen-macro-support are on 3, while curve25519-dalek-derive, windows-implement, windows-interface and zerocopy-derive still pin 2 -- both majors are present until the laggards move, and neither side is this workspace's to choose"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
