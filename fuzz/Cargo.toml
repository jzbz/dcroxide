[package]
name = "dcroxide-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "ISC"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
dcroxide-base58 = { path = "../crates/dcroxide-base58" }
dcroxide-blockchain = { path = "../crates/dcroxide-blockchain" }
dcroxide-chaincfg = { path = "../crates/dcroxide-chaincfg" }
dcroxide-chainhash = { path = "../crates/dcroxide-chainhash" }
dcroxide-crypto = { path = "../crates/dcroxide-crypto" }
dcroxide-dcrec = { path = "../crates/dcroxide-dcrec" }
dcroxide-dcrjson = { path = "../crates/dcroxide-dcrjson" }
# For http_head_parse and ws_frame_read.  It brings the node's whole tree
# (rustls, ring, ureq) into the fuzz build, every crate of it pinned in
# the workspace lockfile at the same version.
dcroxide-node = { path = "../crates/dcroxide-node" }
dcroxide-rpc = { path = "../crates/dcroxide-rpc" }
dcroxide-rpctypes = { path = "../crates/dcroxide-rpctypes" }
dcroxide-stake = { path = "../crates/dcroxide-stake" }
dcroxide-txscript = { path = "../crates/dcroxide-txscript" }
dcroxide-uint256 = { path = "../crates/dcroxide-uint256" }
dcroxide-wire = { path = "../crates/dcroxide-wire" }

[[bin]]
name = "blake256_incremental"
path = "fuzz_targets/blake256_incremental.rs"
test = false
doc = false
bench = false

