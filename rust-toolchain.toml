# The toolchain every build uses, and — because `rust-version` in Cargo.toml
# names the same release — also the oldest one the workspace supports.  The two
# are bumped together: moving this pin is an MSRV bump.
#
# Pinned because `[profile.release]` sets `codegen-units = 1` with thin LTO,
# so the compiler version materially determines the emitted binary.  "Whatever
# stable happens to be installed" is not a reproducible contract for a node
# whose release artifacts someone may want to verify.
#
# A point release rather than a `.0`: 1.97.0 shipped an LLVM miscompilation
# that 1.97.1 fixed seven days later, and 1.98.0 one in vtable generation
# (rust-lang/rust#161441) that 1.98.1 fixed fourteen days later.  Consensus
# code gets the patched build.
#
# Anything that needs a different toolchain must override this file
# explicitly — `cargo +nightly fuzz ...` locally, `RUSTUP_TOOLCHAIN` in CI.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
